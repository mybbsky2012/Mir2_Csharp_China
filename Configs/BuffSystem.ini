; ============================================================
;  自定义 BUFF 属性表 —— Configs\BuffSystem.ini
;  编码：UTF-8（无 BOM）；; 开头为注释
;
;  ★ 若运行目录已存在 BuffSystem.ini，请把下面两个 [节] 追加到
;    文件末尾，不要整份覆盖（槽位 1、2 若已被占用请顺延改号，
;    脚本里的 GIVEBUFF/CHECKBUFF 按显示名引用，无需改脚本）。
;
;  羽化登仙：渡劫成仙的永久属性（脚本 GIVEBUFF 羽化登仙 0 True True False）
;  重塑入魔：渡劫入魔的永久属性（脚本 GIVEBUFF 重塑入魔 0 True True False）
; ============================================================

[1]
Name=羽化登仙
Icon=30034
Visible=True
Stack=ResetDuration
Desc=白日飞升，位列仙班：攻击/魔法/道术+50，防御/魔御+30（永久）
Stat.MaxDC=50
Stat.MaxMC=50
Stat.MaxSC=50
Stat.MaxAC=30
Stat.MaxMAC=30

[2]
Name=重塑入魔
Icon=30035
Visible=True
Stack=ResetDuration
Desc=堕入魔道，血气滔天：攻击速度+5，生命+1000，魔法+1000（永久）
Stat.攻击速度=5
Stat.HP=1000
Stat.MP=1000
