[Skin]
; ============================================================
; 客户端皮肤包开关
; ============================================================
; Name = 皮肤名。留空 = 使用客户端自带的原始界面（默认）。
; 填了名字后，客户端会到  UI\Skin\<名字>\<库名>\<索引>.png  找覆盖图，
; 找到的就换，找不到的仍用原图 —— 所以只放你想改的那几张即可。
;
; 例：Name=我的皮肤  且存在  UI\Skin\我的皮肤\Prguse\939.png
;     -> 载入画面就会换成你自己的图。
Name=uk
