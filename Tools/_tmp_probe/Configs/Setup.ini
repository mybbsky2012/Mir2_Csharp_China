[FakePlayer]
;---------------------------------------------------------------------
; 假人（AI 玩家）系统
;
; 假人在服务端就是「真的 PlayerObject」，所以真人客户端不用改一行代码
; 就能看见它们：外观、等级、装备、头顶名字、喊话气泡、走路打怪全都一致。
;
; 它们只存在于内存，重启服务端会重新生成，不写数据库、不进排行榜，
; 只计入「在线人数」。
;
; 提示：这一段的注释统一用分号开头，且注释里不要出现等号。
;---------------------------------------------------------------------

; 总开关
Enabled=True

; 生成多少个假人（0 表示不生成，上限 300）
Count=30

; 随机等级区间（含两端）
LevelMin=32
LevelMax=45

; 练级地图。写地图文件名或地图序号，逗号分隔，例如 0,1,2,3
; 留空则自动挑选「有怪物刷新点」的地图（按序号取前 20 张）
Maps=0,1,2,3

; 假人会不会说话 / 喊话
Chat=True

; 假人会不会随机上下线（关掉的话就是 50 个假人一直在线）
RandomLogin=True

; 台词文件（相对 Configs 目录）。文件里每行一句，以 # 分号 // 开头的行会被忽略。
; 留空则使用内置台词库
ChatFile=FakePlayerChat.txt
EquipFile=FakePlayerEquip.txt

; 假人之间会不会在野外随机 PK（互相切磋）。关掉就只有打怪了
PK=True
; 每轮判定「要不要挑个人打」的概率（%）
PKChance=6

; 允许假人接受组队邀请，并跟随队长一起换图打怪（队长阵亡时它会自行下线重登）
Follow=True

; 假人登录点（内联写法，多个点用分号隔开，格式 地图序号:X,Y）
; 例如  0:330,330; 3:300,300  —— 一般不用写这里，直接编辑下面的登录点文件更方便
Spawns=

; 登录点文件（相对 Configs 目录）。文件里每行一个「地图 X Y」，
; 假人上线时就站在这些点上；留空或文件里没内容 = 在活动地图上随机登录
SpawnFile=FakePlayerSpawns.txt

