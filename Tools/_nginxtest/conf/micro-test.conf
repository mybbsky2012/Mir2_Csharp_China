worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;
    tcp_nopush    on;

    # ========= A. 客户端现状：/resource?f=xxx（query 传路径）=========
    server {
        listen       18080;
        server_name  _;
        root         D:/mir2-20241027/Tools/_nginxtest/resroot;

        location = /resindex {
            default_type text/plain;
            try_files /resindex.txt =404;
            add_header Cache-Control "no-cache";
        }

        location = /resource {
            # $arg_f 未经 URL 解码，含 %XX 的路径会被原样当文件名
            rewrite ^ /$arg_f break;
            default_type application/octet-stream;
        }
    }

    # ========= B. 改成路径式：/resource/xxx ========
    server {
        listen       18081;
        server_name  _;
        root         D:/mir2-20241027/Tools/_nginxtest/resroot;

        location = /resindex {
            default_type text/plain;
            try_files /resindex.txt =404;
            add_header Cache-Control "no-cache";
        }

        location /resource/ {
            # $uri 已解码，空格/中文都能落到真实文件
            alias D:/mir2-20241027/Tools/_nginxtest/resroot/;
            default_type application/octet-stream;
        }
    }
}
