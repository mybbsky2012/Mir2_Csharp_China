worker_processes 1;
error_log logs/err.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;

    server {
        listen       18083;
        server_name  _;

        location = /resindex {
            alias        D:/Mirserver/ClientResources/resindex.txt;
            default_type text/plain;
            add_header   Cache-Control "no-cache";
        }

        # 模拟「远端零配置」：网站根就是资源根，Data/Map/Sound 直接可访问
        location / {
            root         D:/Mirserver/ClientResources;
            default_type application/octet-stream;
        }
    }
}
