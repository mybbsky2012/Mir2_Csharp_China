worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    tcp_nopush    on;

    # ===== A：客户端现状 /resource?f=xxx（query 传路径，$arg_f 不解码）=====
    server {
        listen       18080;
        server_name  _;
        root         E:/micromir2;

        location = /resindex {
            alias       D:/mir2-20241027/Tools/NginxMicroDeploy/resindex.txt;
            default_type text/plain;
            add_header  Cache-Control "no-cache";
        }

        location = /resource {
            rewrite ^ /$arg_f break;
        }
    }

    # ===== B：路径式 /resource/xxx（$uri 已解码）=====
    server {
        listen       18081;
        server_name  _;

        location = /resindex {
            alias       D:/mir2-20241027/Tools/NginxMicroDeploy/resindex.txt;
            default_type text/plain;
            add_header  Cache-Control "no-cache";
        }

        location /resource/ {
            if ($uri ~ "\.\.") { return 404; }
            alias E:/micromir2/;
        }
    }
}
