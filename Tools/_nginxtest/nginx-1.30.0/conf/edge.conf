worker_processes 1;
error_log logs/err.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;

    # 去掉 /resource 前缀，且保持原始百分号编码（map 对的是未解码的 $request_uri）
    map $request_uri $micro_rel {
        default               "";
        "~^/resource/(.*)$"   "/$1";
    }

    server {
        listen       18082;
        server_name  _;

        location = /resindex {
            alias        D:/Mirserver/ClientResources/resindex.txt;
            default_type text/plain;
            add_header   Cache-Control "no-cache";
        }

        # 旧式 query（客户端现状）：$arg_f 未解码，直接拼给远端 → 远端零配置
        location = /resource {
            if ($arg_f = "")     { return 404; }
            if ($arg_f ~ "\.\.") { return 404; }
            return 302 http://127.0.0.1:18083/$arg_f;
        }

        # 路径式：去前缀后甩给远端
        location /resource/ {
            if ($micro_rel = "") { return 404; }
            return 302 http://127.0.0.1:18083$micro_rel;
        }

        location / { return 404; }
    }
}
