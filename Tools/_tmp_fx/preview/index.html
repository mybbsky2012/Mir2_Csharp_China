  <div class="bar">
    <button class="primary" id="btnPlay">▶ 播放登仙</button>

  </div>
  <div class="note">

    登仙音频 humup.wav 尚未放入，放入预览目录同名文件后播放登仙时自动带声音。

,567,-376,-313],"837":[752,567,-376,-313],"838":[748,567,-376,-313],"839":[740,565,-376,-311],"840":[728,553,-376,-298],"841":[708,545,-376,-290],"842":[692,538,-376,-284],"843":[660,516,-376,-262],"844":[632,512,-376,-258],"845":[608,512,-376,-258],"846":[584,512,-376,-258],"847":[564,512,-376,-258],"848":[544,512,-376,-258],"849":[544,512,-376,-258],"850":[544,512,-376,-258],"851":[544,512,-376,-258],"852":[544,512,-376,-258],"853":[544,512,-376,-258],"990":[140,94,-44,-29],"991":[140,94,-44,-29],"992":[140,96,-44,-30],"993":[144,97,-47,-31],"994":[148,100,-49,-32],"995":[148,102,-49,-33],"996":[152,104,-50,-34],"997":[152,103,-50,-34],"998":[152,105,-51,-34],"999":[156,105,-52,-34],"1000":[156,108,-54,-36],"1001":[160,108,-54,-36],"1002":[160,108,-54,-36],"1003":[160,110,-55,-37],"1004":[160,109,-54,-37],"1005":[160,109,-54,-37],"1006":[152,106,-52,-35],"1007":[132,91,-42,-27],"1008":[132,91,-42,-27],"1009":[132,91,-42,-27],"1020":[168,78,-61,-155],"1021":[176,80,-66,-156],"1022":[192,85,-70,-157],"1023":[200,89,-76,-158],"1024":[224,95,-90,-161],"1025":[236,101,-93,-163],"1026":[248,107,-100,-165],"1027":[256,111,-105,-167],"1028":[256,114,-104,-170],"1029":[284,131,-120,-179],"1030":[372,184,-177,-200],"1031":[368,174,-168,-199],"1032":[376,182,-165,-199],"1033":[344,176,-123,-201],"1034":[316,180,-88,-201],"1035":[316,184,-74,-201],"1036":[292,194,-79,-201],"1037":[284,234,-107,-201],"1038":[340,256,-165,-201],"1039":[260,236,-122,-201],"1040":[220,227,-95,-201],"1041":[168,223,-89,-201],"1042":[176,225,-88,-201],"1043":[160,222,-80,-201],"1044":[148,222,-73,-200],"1045":[132,215,-61,-194],"1046":[96,203,-34,-183],"1047":[76,207,-18,-186],"1048":[44,185,10,-167],"1049":[36,120,12,-103],"1050":[20,94,21,-78],"1051":[12,24,24,-11]};
const CHAR = { w:88, h:84, fx:0, fy:-53 };   // UpWarArmour/01.Lib frame0
const ASC  = range(760, 853);                // 登仙 94 帧
const FEET = range(990, 1009);               // 脚下 20 帧
const BODY = range(1020, 1051);              // 身上飞龙 32 帧
function range(a,b){ const r=[]; for(let i=a;i<=b;i++) if(META[i]) r.push(i); return r; }

// ---- 元素 ----
const $ = id => document.getElementById(id);
const elChar=$('char'), elFeet=$('feet'), elBody=$('body'), elAsc=$('asc'), elPhase=$('phase');
elChar.src = '01_0.png';
setLayer(elChar, CHAR);
function setLayer(el, m){
  el.style.transform = `translate(${CX+m.fx}px, ${CY+m.fy}px)`;
}
// 特效帧绘制顺序：脚下→人物→身上→登仙（DOM 顺序即层级，符合“人物夹在两特效之间”）

// ---- 背景：地面网格 ----
(function bg(){
  const c=$('bg').getContext('2d');
  c.strokeStyle='rgba(255,255,255,0.045)';
  for(let x=0;x<=800;x+=40){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,600); c.stroke(); }
  for(let y=0;y<=600;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(800,y); c.stroke(); }
  c.strokeStyle='rgba(255,120,40,0.25)';
  c.beginPath(); c.ellipse(CX, CY, 90, 32, 0, 0, Math.PI*2); c.stroke();
})();

// ---- 播放器 ----
let timers=[];
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers=[]; }
function show(el, on){ el.style.display = on?'block':'none'; }
function idleState(){
  show(elFeet,false); show(elBody,false); show(elAsc,false);
  elPhase.textContent='待机（无特效）';
}
function playLoop(){
  clearTimers();
  elPhase.textContent='永久驻留：脚下光环 + 身上飞龙';
  show(elAsc,false);
  let f=0, step=0;
  function tick(){
    // 脚下 20 帧 / 身上 32 帧，同为 80ms/帧：脚下循环更快，各自独立步进
    const fi = FEET[f % FEET.length];
    const bi = BODY[step % BODY.length];
    const mf = META[fi], mb = META[bi];
    elFeet.src=`Effect_${fi}.png`; setLayer(elFeet,mf); show(elFeet,true);
    elBody.src=`Effect_${bi}.png`; setLayer(elBody,mb); show(elBody,true);
    f++; step++;
    timers.push(setTimeout(tick, 80));
  }
  tick();
}
function playAscension(){
  clearTimers(); idleState();
  elPhase.textContent='登仙动画播放中…（760-853）';
  // 音频：文件存在则同步播放
  try{
    if(!playAscension.audio){ playAscension.audio=new Audio('humup.wav'); }
    playAscension.audio.currentTime=0;
    playAscension.audio.play().catch(()=>{});
  }catch(e){}
  let i=0;
  function tick(){
    if(i>=ASC.length){ playAscension.audio && playAscension.audio.pause(); playLoop(); return; }
    const fi=ASC[i], m=META[fi];
    elAsc.src=`Effect_${fi}.png`; setLayer(elAsc,m); show(elAsc,true);
    i++;
    timers.push(setTimeout(tick, 80));
  }
  tick();
}
$('btnPlay').onclick = playAscension;
$('btnLoop').onclick = () => { try{playAscension.audio&&playAscension.audio.pause();}catch(e){} playLoop(); };
idleState();
// 页面加载后先演示一轮登仙
setTimeout(playAscension, 400);
</script>
