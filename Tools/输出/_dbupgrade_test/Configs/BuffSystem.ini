; ============================================================
;  自定义 BUFF 属性表 —— Configs\BuffSystem.ini
;  编码：UTF-8（无 BOM）；; 开头为注释
;
;  ★ 编码（2026-11-12 起：羽化已迁出自定义槽位）
;    [羽化登仙]              —— 纯标记：这个角色已羽化。不给属性。
;    [羽化一重] ~ [羽化十重] —— 真正给属性的地方，也是客户端判定外观的依据。
;    下面是旧的槽位分配，仅供对照与兼容（代码已不再写入）：
;    [1]        旧·羽化登仙（= Custom1 / 230）
;    [2]        （另一条分支，未动）
;    [3] ~ [12] 旧·羽化登仙·一重 ~ 十重（= Custom3~12 / 232~241）
;    [13] ~ [24] 空闲
;
;  ★ 为什么"标记"和"重数"要分开
;    客户端判断外观时，只能从 ObjectPlayer.Buffs 拿到 BUFF 枚举值，
;    拿不到 Values[]（服务端 PlayerObject.cs:5537 只 Select(e => e.Type)）。
;    所以"第几重"必须靠不同的枚举值区分 —— [3]~[12] 就是这个作用。
;    [1] 单独留一个纯标记，是给"老号只挂过羽化标记、还没定重数"的情况兜底：
;    客户端看到 [1] 但没有 [3]~[12] 时，按一重外观显示。
;
;  ★ 三个必守项（改坏了羽化会掉）
;    Stack=Infinite   —— 永久。用 ResetDuration 的话，GIVEBUFF 传的时长是 0，
;                        下一秒就会被 HumanObject 的 tick 清掉（原 [1][2] 的写法就是这个坑）。
;    Property=None    —— 绝不能带 RemoveOnExit（下线即删）/ RemoveOnDeath（死亡即删）。
;    Visible=True     —— 不加这行，别人看不到你的羽化 buff，客户端也就画不出羽化外观。
;
;  ★ 存档：不用做任何事
;    HumanObject.Buffs 就是 Info.Buffs 本身，加进来的 BUFF 当场就在待存档结构里，
;    定时存盘与下线存盘都会带上（CharacterInfo.Save 的 Buff 段），重登由 ReplayBuff 重放。
;
;  ★ 脚本用法（NPC 脚本 / GM 命令）
;    GIVEBUFF 羽化登仙 0 True True False        升到羽化状态（标记）
;    GIVEBUFF 羽化登仙·三重 0 True True False   设为三重（会带 3 重的属性）
;    REMOVEBUFF 羽化登仙                        取消羽化
;    换重数时记得把上一重的 buff REMOVEBUFF 掉，否则属性会叠加。
;    ★旧写法「槽位号」（GIVEBUFF 3 / GIVEBUFF 1）已废弃：那走的是 Custom3/Custom1，
;      新逻辑不认，挂了也不会羽化。请用枚举名或显示名。
;
;  ★ 数值说明
;    十重的属性刻意做成"一重 = 满级的 1/10"，十重合计正好等于原来 [1] 的
;    MaxDC/MaxMC/MaxSC +50、MaxAC/MaxMAC +30。要调就在每一重上等比例改。
;    每重的 Stat 数值写法支持「基础」或「基础+每级」（后者按施法者等级成长）。
; ============================================================


; ------------------------------------------------------------
; [1] 羽化登仙 —— 纯标记，不给属性
; ------------------------------------------------------------
[1]
Name=羽化登仙
Icon=30034
Visible=True
Stack=Infinite
Property=None
Desc=已渡劫飞升（外观标记，属性由「羽化登仙·N重」提供）


; ------------------------------------------------------------
; [3] ~ [12] 羽化登仙 一重 ~ 十重
;     属性梯度：每重 MaxDC/MaxMC/MaxSC +5、MaxAC/MaxMAC +3、HP/MP +100
;     十重 = +50 / +30 / +1000（与旧 [1] 的最终值一致）
; ------------------------------------------------------------
