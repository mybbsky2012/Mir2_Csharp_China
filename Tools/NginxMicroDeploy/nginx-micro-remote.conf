# =============================================================================
# 微端资源站（远端 nginx）完整配置 —— 客户端可直连本机下载，无需主服中转
#
# ★ 先备份你现有的 nginx.conf：cp nginx.conf nginx.conf.bak_$(date +%Y%m%d)
# ★ 如果你的服务器上还有别的站点/目录在用，**不要整体覆盖**，
#    只把下面「A 段」放进 http{}、「B 段」三段 location 贴进你原有的 server{}。
#
# 需要上传到网站根（/www/mir2res）：
#   1. resindex.txt          资源清单（3652 条），由主服 gen_resindex.py 生成
#   2. Data/ Map/ Sound/ UI- 资源本体（现有结构不动）
#
# 实测（同构配置 + 真客户端 HttpClient，21 项断言全过，全量 3652/3652 = 100%）
# =============================================================================

worker_processes      auto;

events {
    worker_connections  2048;
}

http {
    include             mime.types;
    default_type        application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;

    # ★ 不要开 gzip：.Lib / .map 本身已压缩，开了白耗 CPU 还可能干扰 Range

    # ------------------------- A 段：放进 http { } ---------------------------
    # 旧式 query URL：/resource?f=Data/AWeapon/04%20L.Lib
    # ★ 必须用 $request_uri（未解码的原始串），不能用 $arg_f
    #   $arg_f 不解码 → 文件名含空格/中文的必然 404（本服 43 个武器图库）
    #   $request_uri 原样带 %20 / %E8，302 出去后由 nginx 自己解码，落到真实文件
    map $request_uri $micro_rel {
        default                "";
        "~^/resource\?f=(.*)$" "/$1";
    }

    server {
        listen       65534;
        server_name  _;

        # 网站根 = 资源根
        root         /www/mir2res;

        # ---------------------------------------------------------------------
        # B 段
        # ---------------------------------------------------------------------

        # 1) 资源清单：客户端第一个请求，全程只取一次（切服务器不会重拉）
        location = /resindex {
            alias         /www/mir2res/resindex.txt;
            default_type  text/plain;
            add_header    Cache-Control "no-cache";
        }

        # 2) 路径式：/resource/Data/Monster/000.Lib
        #    $uri 已 URL 解码，带空格/中文的文件名也能落到真实文件
        #    以后客户端若改成路径式 URL，这一段直接生效
        location /resource/ {
            if ($uri ~ "\.\.") { return 404; }
            alias /www/mir2res/;
        }

        # 3) 旧式 query → 自身 302 到真实路径（当前客户端就是这种）
        location = /resource {
            if ($micro_rel = "")     { return 404; }
            if ($micro_rel = "/")    { return 404; }
            if ($micro_rel ~ "\.\.") { return 404; }
            return 302 $micro_rel;
        }

        # 4) 普通静态：资源本身（网站根直取）
        #    ★ 必须 try_files =404，不能 index/fallback 到 index.html
        #      否则缺失文件会返回 200+HTML，被客户端当成 .Lib 写进本地，图库直接废
        location / {
            try_files $uri =404;
        }
    }
}

# =============================================================================
# 部署后自检（在主服上跑，把 URL 换成远端）：
#   python D:\mir2-20241027\Tools\NginxMicroDeploy\verify_micro.py ^
#          --base http://219.138.108.82:65534 --url-style root ^
#          --index D:\Mirserver\ClientResources\resindex.txt
#
# 或者用真客户端链路测试（更严格，含 302 跟随 / Range / 内容 md5）：
#   D:\mir2-20241027\Tools\MicroRedirectTest\bin\Release\net8.0\MicroRedirectTest.exe ^
#          http://219.138.108.82:65534 D:\Mirserver\ClientResources
#
# 三条铁律：
#   1. Linux 区分大小写：上传必须保留原始大小写（Data/Effect.Lib ≠ Effect.lib）
#   2. 404 必须是真 404，不许有 SPA fallback
#   3. 素材增删后重新生成 resindex.txt 并上传覆盖，否则新素材永远下不到
# =============================================================================
