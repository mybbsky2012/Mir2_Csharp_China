# ============================================================================
#  韩Mir2 微端下载服务 —— nginx 配置（Windows / Linux 通用，改路径即可）
#
#  用法一：直接替换 nginx/conf/nginx.conf，双击 nginx.exe 就能跑
#  用法二：已有 nginx，把下面 server { } 整段贴进你现有 http { } 里
#
#  部署前必看 3 点：
#   1. 资源根只放 Data / Map / Sound，别把客户端整个目录暴露出去
#      （推荐用目录联接：mklink /J E:\microres\Data E:\micromir2\Data）
#   2. resindex.txt 用 Tools\NginxMicroDeploy\gen_resindex.py 生成，必须 UTF-8 无 BOM
#   3. 404 必须是真 404，不要配 SPA fallback / 自定义错误页返回 200
# ============================================================================

worker_processes  2;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;   # .lib/.map/.hyb 等未知扩展名一律二进制流
    sendfile      on;
    sendfile_max_chunk 0;                     # 不限单次 chunk：589MB 的 Tiles.Lib 也能满速
    tcp_nopush    on;
    keepalive_timeout 65;
    access_log    off;                        # 微端请求量大，排障时再打开

    # 可选：单 IP 并发上限（客户端 Concurrency=4，给 16 倍余量）
    #limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen       8080;
        server_name  _;

        # ★ 换成你的资源根。目录里应当是 Data/ Map/ Sound/ 三个子目录
        root  E:/microres;

        charset utf-8;

        # ---------------- 资源清单 ----------------
        location = /resindex {
            alias        E:/microres/resindex.txt;
            default_type text/plain;
            add_header   Cache-Control "no-cache";
        }

        # ---------------- B. 路径式（推荐，需客户端 11-14 版起） ----------------
        #   GET /resource/Data/Monster/000.Lib
        #   nginx 的 $uri 已经做过 URL 解码，带空格/中文的文件名也能落到真实文件
        location /resource/ {
            if ($uri ~ "\.\.") { return 404; }
            alias E:/microres/;
            #limit_conn perip 16;
        }

        # ---------------- A. 兼容旧客户端（query 传路径） ----------------
        #   GET /resource?f=Data/Monster/000.Lib
        #   ★ $arg_f 未解码：文件名含空格/中文的会 404（本服 43 个，见 README）
        location = /resource {
            if ($arg_f ~ "\.\.") { return 404; }
            rewrite ^ /$arg_f break;
        }

        # ---------------- 禁止绕过接口直接拖库（可选） ----------------
        location /Data/  { return 404; }
        location /Map/   { return 404; }
        location /Sound/ { return 404; }
    }
}
