# ============================================================================
# 微端「本机给清单、文件 302 甩给远端」配置模板
# ----------------------------------------------------------------------------
# 已验证（Tools/MicroRedirectTest，21 项全过）：
#   · 客户端 HttpClient 自动跟随 302（未关 AllowAutoRedirect）
#   · 跟随 302 后 Range 头保留 → 断点续传仍是 206，Content-Range 正确
#   · 带空格（04 L.Lib）、中文（自定义素材.Lib）经 302 均 200，md5 一致
#   · 远端 404 原样透传 → 客户端按「服务端确实没有」永久拉黑（语义不变）
#   · 目录穿越 f=../ 与 ..%2f 均被拦（400/404）
#   · 旧式 query 全量 3661/3661 = 100.00%
#
# 前提：远端只需「网站根目录 = 资源根」，无需任何 rewrite / 脚本 / MIME 配置，
#       静态服务器（nginx / IIS / Apache / 对象存储）都行。
# ============================================================================
#
# 用法：
#   1. 把 map 块放到 nginx.conf 的 http { } 里，server 之前。
#   2. 把两个 location 放进已有的 server { }（你的 8888 站点）。
#   3. 把 RESOURCE_HOST 改成远端的公网地址，例如
#         http://res.example.com
#         http://1.2.3.4:8080
#         https://cdn.example.com
#      ★ 必须填「玩家机器能直连」的地址。填内网 IP 会导致外网玩家 302 后连不上。
#   4. nginx -t && nginx -s reload
#
# 回退：删掉这两个 location，恢复原来的 alias 配置即回到「本机出文件」。
# ============================================================================


# ---------- ① 放在 http { } 内、server 之前 ----------
# 去掉 /resource 前缀，同时对的是未解码的 $request_uri，
# 所以 %20 / %E8 这类编码会原样带给远端（远端解码后正好命中真实文件名）。
map $request_uri $micro_rel {
    default               "";
    "~^/resource/(.*)$"   "/$1";
}


# ---------- ② 放在 8888 的 server { } 内 ----------
server {
    listen       8888;
    server_name  localhost;

    # ... 你原有的 location / 等内容保持不变 ...

    # ---- 微端清单：由本机提供（改了素材只需重跑 gen_resindex.py）----
    location = /resindex {
        alias        D:/Mirserver/ClientResources/resindex.txt;
        default_type text/plain;
        add_header   Cache-Control "no-cache";
        add_header   Access-Control-Allow-Origin "*";
    }

    # ---- 旧式 query（客户端当前用的就是这种）：原样拼给远端 ----
    location = /resource {
        set $origin "http://RESOURCE_HOST";

        if ($arg_f = "")     { return 404; }
        if ($arg_f ~ "\.\.") { return 404; }   # 目录穿越：$arg_f 未解码，.. 一定出现原文

        return 302 $origin/$arg_f;
    }

    # ---- 路径式（以后客户端若改成 /resource/<path> 也能用）----
    location /resource/ {
        set $origin "http://RESOURCE_HOST";

        if ($micro_rel = "") { return 404; }

        return 302 $origin$micro_rel;
    }
}


# ============================================================================
# 注意（都是实测过的坑）
# ----------------------------------------------------------------------------
# 1. 两边资源必须严格一致。清单只取本机那一份（ResourceDownloader 里
#    _remoteIndex 只加载一次，切服务器不重拉），远端缺文件 = 客户端永久拉黑该文件。
# 2. 远端不要开 gzip、不要配 SPA fallback（返回 index.html）——会被当成 .Lib 存进本地。
# 3. 远端 404 必须是真 404；5xx 会被客户端当成"偶发"冷却 30 秒重试。
# 4. 302 会把远端地址暴露给客户端，远端等于公开可拖库。介意就加 IP 白名单或限速。
# 5. 玩家如果开着系统代理/加速器，302 到另一个域名可能被代理拦截（本机沙箱代理
#    就复现过：302 不跟随，直接返回 302 内容）。这类玩家会表现为「资源下不到」。
# 6. 远端要能扛 客户端 Concurrency(=4) × 在线人数 的并发。
# 7. 想回退成本机出文件：把两个 location 换成
#       location /resource/ { alias D:/Mirserver/ClientResources/; }
#       location = /resource { ...原 alias 方案... }
#    （即当前 nginx.conf.bak_micro_20261113 之后那一版）
# ============================================================================
