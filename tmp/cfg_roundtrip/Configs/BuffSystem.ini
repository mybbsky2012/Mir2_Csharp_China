; ============================================================
; 自定义 BUFF 属性表 —— 由 GM 工具「数据库 → 自定义BUFF属性」维护
; 编码：UTF-8（无 BOM）；; 开头为注释
;
; [节名] 两种写法：
;   数字 1~24  = 自定义 BUFF 槽位（对应 BuffType.Custom1~Custom24）
;   枚举名     = 给已有 BUFF 追加属性（如 [隐身术]）
;
; 字段：
;   Name     显示名（客户端 BUFF 提示框标题；自定义槽位必填）
;   Icon     图标索引：0=客户端原有映射；10000+=Prguse2；20000+=MagIcon；40000+=MagIcon2
;   Visible  是否对其他玩家可见（默认 True）
;   Stack    堆叠方式：None/ResetDuration/StackDuration/StackStat/StackStatAndDuration/
;            Infinite/ResetStat/ResetStatAndDuration/AttrStackStat/AttrStackStatAndDuration
;   Property 标记（可用 | 叠加）：None/RemoveOnDeath/RemoveOnExit/Debuff/PauseInSafeZone
;   Desc     说明文本
;   Stat.属性=数值     数值写「基础」或「基础+每级」
;            例：Stat.MaxAC=5+2  表示基础+5，施法者每级再+2
; ============================================================
