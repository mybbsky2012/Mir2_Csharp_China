[Guide]
01=需要Alt键,需要Shift键,需要~键,需要Ctrl键
02=有3个选项: 0/1/2
03=0 < 不能按此键使用该功能
04=1 < 必须按下这个键才能使用这个功能
05=2 < 按这个键使用这个功能没关系
06=默认情况下只使用2，除非同一个键上有两个函数
07=示例：修改攻击模式（Ctrl+H）和帮助（H）
08=如果将这两个功能中的任意一个设置为需要Shift键 2次，那么它们将无法同时工作
09=
10=要获取所需密钥的值，请查看:
11=https://msdn.microsoft.com/en-us/library/system.windows.forms.keys(v=vs.110).aspx

